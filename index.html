<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<!-- iPhone/Android 加到主屏后以独立 App 方式运行(去掉 Safari 工具栏 → 自定义下拉刷新生效,不触发 Safari 原生刷新) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cycle Ops">
<title>Cycle Ops · Live Portfolio</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --card-border: #21262d;
    --text: #e6edf3; --muted: #8b949e;
    --green: #3fb950; --red: #f85149; --amber: #d29922;
    --blue: #58a6ff; --purple: #bc8cff; --teal: #39c5cf; --orange: #f0883e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* body 不滚动、内部 #scroll 滚动;下拉时整个 #scroll 下移,露出下层指示区(原生下拉手感) */
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
  #scroll { position: relative; z-index: 2; height: 100%; background: var(--bg);
    overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: none;
    transition: transform .3s cubic-bezier(.2, .8, .2, 1); will-change: transform; }
  #scroll.dragging { transition: none; }
  /* 顶部留出刘海/状态栏安全区(独立 App 模式 black-translucent 下页面全屏铺满,内容需下移让开时钟) */
  .wrap { max-width: 1100px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 6px)
             calc(env(safe-area-inset-right, 0px) + 6px)
             calc(env(safe-area-inset-bottom, 0px) + 16px)
             calc(env(safe-area-inset-left, 0px) + 6px); }
  /* 下拉刷新指示:固定于顶部、藏在 #scroll 下层,内容下移时从顶部露出 */
  #ptr { position: fixed; top: 0; left: 0; right: 0; z-index: 1;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    height: calc(64px + env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px);
    color: var(--muted); font-size: 12.5px; letter-spacing: .2px; pointer-events: none; }
  #ptr #ptr-icon { display: inline-block; transition: transform .18s ease; font-size: 15px; opacity: .8; }
  #ptr.spin #ptr-icon { animation: ptrspin .8s linear infinite; }
  @keyframes ptrspin { to { transform: rotate(360deg); } }
  /* header/价格行左右内缩 14px,与卡片内容(card padding 16px 14px)对齐,免得贴边显窄 */
  header { display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px; flex-wrap: wrap; gap: 8px; padding: 0 14px; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  h1 .sub { color: var(--muted); font-weight: 400; }
  .status { display: flex; align-items: center; gap: 10px; color: var(--muted);
    font-size: 13px; font-variant-numeric: tabular-nums; }
  .status .warn { color: var(--amber); }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green);
    animation: pulse 2s infinite; flex-shrink: 0; }
  .live-dot.bad { background: var(--red); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  .prices .up { color: var(--green); font-size: 10px; }
  .prices .down { color: var(--red); font-size: 10px; }
  button { background: #21262d; color: var(--text); border: 1px solid var(--card-border);
    border-radius: 6px; padding: 4px 12px; font-size: 12px; cursor: pointer; }
  button:hover { background: #30363d; }
  .prices { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted);
    font-size: 13px; margin-bottom: 14px; padding: 0 14px; font-variant-numeric: tabular-nums; }
  .prices b { color: var(--text); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--card-border);
    border-radius: 12px; padding: 16px 14px; }
  .span-4 { grid-column: span 4; }
  .span-6 { grid-column: span 6; }
  @media (max-width: 800px) { .span-4, .span-6 { grid-column: span 12; } }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); margin-bottom: 8px; }
  .big { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
  .big small { font-size: 16px; color: var(--muted); font-weight: 400; }
  .delta { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .gauge-wrap { display: flex; align-items: center; gap: 20px; }
  .donut { width: 110px; height: 110px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0; }
  .donut::before { content: ""; position: absolute; width: 78px; height: 78px;
    background: var(--card); border-radius: 50%; }
  .donut span { position: relative; font-size: 20px; font-weight: 700; }
  .redline-note { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; margin-top: 6px; }
  .pill.red { background: rgba(248,81,73,.15); color: var(--red); border: 1px solid rgba(248,81,73,.4); }
  .pill.green { background: rgba(63,185,80,.15); color: var(--green); border: 1px solid rgba(63,185,80,.4); }
  .alloc-wrap { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; margin-top: 8px; }
  .alloc-donut { width: 170px; height: 170px; border-radius: 50%; position: relative;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .alloc-donut::before { content: ""; position: absolute; width: 112px; height: 112px;
    border-radius: 50%; background: var(--card); }
  .alloc-donut .ctr { position: relative; text-align: center; }
  .alloc-donut .ctr b { display: block; font-size: 17px; letter-spacing: -0.3px;
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
  .alloc-donut .ctr i { font-style: normal; font-size: 10px; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted); }
  .legend { display: grid; grid-template-columns: 1fr; gap: 9px; font-size: 13px;
    flex: 1; min-width: 210px; }
  .legend .row { display: flex; justify-content: space-between; align-items: center; }
  .legend .name { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .legend .val { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .legend .name { white-space: nowrap; }
  .legend .pct { display: inline-block; min-width: 52px; text-align: right; margin-right: 10px;
    color: var(--muted); font-weight: 400; font-size: 12px; }
  .legend .permo { color: var(--muted); font-weight: 400; font-size: 11px; margin-left: 2px; }
  .legend .inc-total { padding-top: 8px; border-top: 1px solid var(--card-border); }
  .legend .inc-total .name { color: var(--text); font-weight: 600; }
  .legend .inc-total .val { color: var(--green); }
  .meter { margin-top: 10px; }
  .meter .track { height: 8px; background: #21262d; border-radius: 4px; overflow: hidden; }
  .meter .fill { height: 100%; border-radius: 4px; }
  .meter .row { display: flex; justify-content: space-between; font-size: 12px;
    color: var(--muted); margin-top: 5px; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px;
    text-transform: uppercase; letter-spacing: .5px; padding: 6px 8px; border-bottom: 1px solid var(--card-border); }
  td { padding: 8px; border-bottom: 1px solid var(--card-border); }
  tr:last-child td { border-bottom: none; }
  td.num { text-align: right; font-weight: 600; }
  th.num { text-align: right; }
  .tag { font-size: 11px; color: var(--muted); }
  tr:hover td { background: rgba(88,166,255,.04); }
  .apy { font-weight: 600; cursor: default; }
  .apy.live { color: var(--green); }
  .apy.neg { color: var(--red); }
  .apy.est { color: var(--amber); }
  .apy.none { color: var(--muted); font-weight: 400; }
  .table-note { font-size: 11px; color: var(--muted); margin-top: 8px; }
  .ladder { display: flex; align-items: flex-end; gap: 6px; margin-top: 12px; height: 120px; }
  .rung { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; }
  .rung .bar { width: 100%; border-radius: 6px 6px 0 0; background: #21262d;
    border: 1px solid var(--card-border); border-bottom: none; }
  .rung .price { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }
  .rung.current .bar { background: rgba(88,166,255,.25); border-color: var(--blue); }
  .rung.current .price { color: var(--blue); font-weight: 700; }
  .ladder-note { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.5; }
  ul.todo { list-style: none; font-size: 13.5px; }
  ul.todo li { display: flex; gap: 10px; align-items: baseline; padding: 7px 0;
    border-bottom: 1px solid var(--card-border); line-height: 1.45; }
  ul.todo li:last-child { border-bottom: none; }
  .prio { flex-shrink: 0; font-size: 10px; font-weight: 700; padding: 2px 7px;
    border-radius: 999px; letter-spacing: .5px; }
  .prio.p0, .prio.p1 { background: rgba(248,81,73,.15); color: var(--red); border: 1px solid rgba(248,81,73,.4); }
  .prio.p2 { background: rgba(210,153,34,.15); color: var(--amber); border: 1px solid rgba(210,153,34,.4); }
  .prio.p3 { background: #21262d; color: var(--muted); border: 1px solid var(--card-border); }
  footer { margin-top: 28px; color: var(--muted); font-size: 12px; text-align: center; }
  .span-12 { grid-column: span 12; }
  summary.label { cursor: pointer; margin-bottom: 0; }
  .md { font-size: 13px; line-height: 1.7; margin-top: 14px; }
  .md h1 { font-size: 16px; margin: 18px 0 8px; }
  .md h2 { font-size: 14px; margin: 16px 0 6px; color: var(--blue); }
  .md h3 { font-size: 13px; margin: 12px 0 4px; color: var(--muted); }
  .md ul { padding-left: 20px; margin: 4px 0; }
  .md li { margin: 3px 0; }
  .md p { margin: 6px 0; }
  .md blockquote { border-left: 3px solid var(--card-border); padding-left: 10px;
    color: var(--muted); margin: 6px 0; }
  .md hr { border: none; border-top: 1px solid var(--card-border); margin: 14px 0; }
  .md table { margin: 8px 0; }
  .md code { background: #21262d; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .md input[type=checkbox] { accent-color: var(--green); }
  #gate { display: none; position: fixed; inset: 0; background: var(--bg);
    z-index: 10; align-items: center; justify-content: center; }
  .gate-card { background: var(--card); border: 1px solid var(--card-border);
    border-radius: 12px; padding: 32px 36px; width: 320px; text-align: center; }
  .gate-card h2 { font-size: 18px; margin-bottom: 4px; }
  .gate-card p { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .gate-card input[type="password"] { width: 100%; background: #0d1117; color: var(--text);
    border: 1px solid var(--card-border); border-radius: 6px; padding: 8px 10px;
    font-size: 14px; margin-bottom: 12px; }
  .gate-card input[type="password"]:focus { outline: none; border-color: var(--blue); }
  .gate-card .rem { display: flex; align-items: center; gap: 6px; color: var(--muted);
    font-size: 12px; margin-bottom: 14px; cursor: pointer; }
  .gate-card button { width: 100%; padding: 8px; font-size: 13px; }
  .gate-card .err { color: var(--red); font-size: 12px; margin-top: 10px; min-height: 16px; }

  /* ---- refinement layer: type, atmosphere, motion, mobile ---- */
  body { font-family: "Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .big, .prices, td.num, .legend .val, .meter .row, .donut span, .status,
  .rung .price, .gate-card input { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(1100px 480px at 75% -8%, rgba(88,166,255,.08), transparent 60%),
      radial-gradient(900px 420px at 5% 108%, rgba(57,197,207,.06), transparent 60%),
      repeating-linear-gradient(0deg, transparent 0 23px, rgba(230,237,243,.012) 23px 24px); }
  h1 .mark { color: var(--blue); margin-right: 2px; }
  .card { transition: border-color .25s ease; }
  .card:hover { border-color: #313a46; }
  button { transition: background .15s ease, border-color .15s ease; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .apy[title] { cursor: help; border-bottom: 1px dotted rgba(139,148,158,.5); }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .table-wrap td:first-child, .table-wrap th:first-child { position: sticky; left: 0; background: var(--card); }
  .prices .up, .prices .down { display: inline-block; animation: pop .5s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(3px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  @media (prefers-reduced-motion: no-preference) {
    .grid.animate-in .card { animation: rise .5s cubic-bezier(.2,.7,.3,1) backwards; }
    .grid.animate-in .card:nth-child(2) { animation-delay: .05s; }
    .grid.animate-in .card:nth-child(3) { animation-delay: .10s; }
    .grid.animate-in .card:nth-child(4) { animation-delay: .15s; }
    .grid.animate-in .card:nth-child(5) { animation-delay: .20s; }
    .grid.animate-in .card:nth-child(6) { animation-delay: .25s; }
    .grid.animate-in .card:nth-child(7) { animation-delay: .30s; }
    .grid.animate-in .card:nth-child(8) { animation-delay: .35s; }
  }
  #tipbox { position: fixed; z-index: 50; max-width: 300px; background: #1c2330;
    border: 1px solid #30363d; border-radius: 8px; padding: 8px 11px; font-size: 12px;
    line-height: 1.55; color: var(--text); box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  @media (max-width: 800px) {
    /* body 不再加 padding:间距由 #scroll/.wrap 统一处理(旧 padding 会露出 body::before 底纹,与 #scroll 纯色产生色差接缝) */
    .big { font-size: 27px; }
    table { font-size: 12.5px; }
    td, th { padding: 8px 6px; }
    button { padding: 8px 14px; font-size: 13px; }
    .gate-card input[type="password"] { font-size: 16px; }
    .gauge-wrap { gap: 14px; }
    .donut { width: 96px; height: 96px; }
    .donut::before { width: 68px; height: 68px; }
    .donut span { font-size: 17px; }
  }
</style>
</head>
<body>
<div id="ptr"><span id="ptr-icon">&#8595;</span><span id="ptr-text">Pull to refresh</span></div>
<div id="gate">
  <div class="gate-card">
    <h2>Cycle Ops</h2>
    <p>Enter the password to decrypt the dashboard</p>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Password">
    <label class="rem"><input type="checkbox" id="remember" checked> Remember on this device</label>
    <button id="unlock">Unlock</button>
    <div id="gate-err" class="err"></div>
  </div>
</div>
<div id="scroll"><div class="wrap">
<header>
  <h1><span class="mark">◈</span> Cycle Ops <span class="sub">· Live Portfolio</span></h1>
  <div class="status"><span class="live-dot" id="live"></span><span id="status">locked</span></div>
</header>
<div class="prices" id="prices"></div>
<div class="grid" id="app"></div>
<footer id="foot"></footer>
</div></div>

async function httpJson(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(url.split("/")[2] + " HTTP " + r.status);
  return r.json();
}
// JSON-RPC 故障转移:按顺序试各端点,任一成功即返回;全挂才抛错(调用方退备援)。
// 记住上次成功的端点(sticky),同一次刷新里的后续调用不再从已挂的端点重试。
// 单端点时代的教训:publicnode 一挂,质押/兑换率/激励/NAV/钱包全退备援,页面显示的是
// 备援常量(如激励 1.52%)而非真实值,肉眼看像"收益掉了",可能误触 6.5% 退出线。
const rpcSticky = {};
async function jsonRpc(kind, urls, body, label) {
  const start = rpcSticky[kind] || 0;
  let lastErr;
  for (let i = 0; i < urls.length; i++) {
    const idx = (start + i) % urls.length;
    try {
      const j = await httpJson(urls[idx], {method: "POST",
        headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
      if (j.error) throw new Error(JSON.stringify(j.error));
      rpcSticky[kind] = idx;          // 记住可用端点
      return j.result;
    } catch (e) {
      lastErr = e;
      console.warn("RPC endpoint failed:", urls[idx], String(e));
    }
  }
  throw new Error(label + " — all " + urls.length + " endpoints failed: " + lastErr);
}
async function rpcCall(method, params) {
  return jsonRpc("sol", CONFIG.rpcs || [CONFIG.rpc],
                 {jsonrpc: "2.0", id: 1, method, params}, "RPC " + method);
}
async function ethCall(to, data) {
  return jsonRpc("eth", CONFIG.ethRpcs || [CONFIG.ethRpc],
                 {jsonrpc: "2.0", id: 1, method: "eth_call", params: [{to, data}, "latest"]},
                 "eth_call");
}

// 币安钱包原生质押(利润口径):不在 Marinade 账本内,只能靠 stake pubkey 快照(脚本上次运行注入)
// + getMultipleAccounts 读实时 lamports(getProgramAccounts 浏览器端 40s 超时,故脚本端枚举、
// 浏览器端只读余额)。这部分账户稳定、极少变动,快照过期风险低。
async function nativeStake(addr) {
  const list = CONFIG.stakeAccounts.kamino;
  if (!list || !list.length) throw new Error("无 stake 账户快照: " + addr);
  const opt = {encoding: "base64", dataSlice: {offset: 0, length: 0}};  // 只需 lamports
  const lamports = {};  // pubkey -> lamports;读到才填,漏读的不填
  async function read(keys) {
    const chunks = [];
    for (let i = 0; i < keys.length; i += 10) chunks.push(keys.slice(i, i + 10));  // publicnode getMultipleAccounts 上限 10 key/次
    const results = await Promise.all(chunks.map(c => rpcCall("getMultipleAccounts", [c, opt])));
    chunks.forEach((c, ci) => c.forEach((pk, vi) => {
      const v = results[ci].value[vi];
      if (v) lamports[pk] = v.lamports;  // null = 本次没读到(publicnode 偶发),留空待重试
    }));
  }
  await read(list);
  let missing = list.filter(pk => !(pk in lamports));
  if (missing.length) await read(missing);         // 偶发漏读重试一次
  missing = list.filter(pk => !(pk in lamports));
  // 快照账户是本次服务端枚举、链上确实存在的;若仍读不到说明本次读取不完整,
  // 宁可抛错让上层退回上次基线值,也绝不显示漏计的偏低数(否则组合/利润 SOL 会莫名变小)
  if (missing.length) throw new Error(`stake 快照读取不完整: 缺 ${missing.length}/${list.length} @ ${addr}`);
  let sol = 0;
  for (const pk of list) sol += lamports[pk];
  return sol / 1e9;
}
// Trust Wallet 原生质押(利润口径):委托给 Marinade 管理,其 bot 会频繁拆分/合并 stake 账户,
// 本地快照屡次读漏。改用 Marinade 官方 TVL API 直接查总额,免去快照,也就不会再过期。
async function marinadeTvl(addr) {
  const d = await httpJson("https://native-staking.marinade.finance/v1/tvl?withdraw_authority=" + addr);
  return d.total_staked_sol;
}
// 实时原生质押 SOL:Trust(Marinade TVL API)+ 币安钱包(stake 账户快照)。组合口径与利润口径都用它。
async function liveStakingSol() {
  const [m, k] = await Promise.all([marinadeTvl(CONFIG.walletMarinade), nativeStake(CONFIG.walletKamino)]);
  // 两份分开返回:Trust = Marinade Native(奖励复利进 stake 账户)/ 币安 = Marinade Recipes(奖励按 epoch 以 USDC 发到钱包)
  return {nativeSol: m + k, nativeTrust: m, nativeBinance: k};
}
// 纯钱包稳定币:USDC + USDT 两个固定 ATA 直读(都按 $1 计,都算干火药)。
// 此前只读 USDC,Trust Wallet 里的 USDT 全程不计入总资产 → 总资产低估、SOL 占比高估。
async function walletStables(addr) {
  const which = addr === CONFIG.walletMarinade ? "marinade"
              : addr === CONFIG.walletKamino   ? "kamino" : null;
  if (!which) throw new Error("无稳定币 ATA 映射: " + addr);
  const atas = [CONFIG.usdcAta[which], CONFIG.usdtAta[which]];
  const vals = (await rpcCall("getMultipleAccounts", [atas, {encoding: "base64"}])).value;
  const read = v => {
    if (!v) return 0;  // 账户不存在 → 0
    const b = Uint8Array.from(atob(v.data[0]), c => c.charCodeAt(0));
    let amt = 0n;  // u64 小端,偏移 64
    for (let i = 7; i >= 0; i--) amt = (amt << 8n) | BigInt(b[64 + i]);
    return Number(amt) / 1e6;
  };
  return {usdc: read(vals[0]), usdt: read(vals[1])};
}
async function walletSol(addr) {
  return (await rpcCall("getBalance", [addr])).value / 1e9;
}
function kaminoUrl(market) {

// OnRe ONyc NAV:读 offer 账户激活定价向量,按程序 get_nav 阶梯价算
// price = base_price × (1 + apr×step_end/(APR_SCALE×SECONDS_IN_YEAR)),scale 1e9。失败 → 抛错(调用方退备援)
async function onycNav() {
  const v = (await rpcCall("getAccountInfo", [CONFIG.onreOffer, {encoding: "base64"}])).value;
  if (!v) throw new Error("offer 账户不存在");
  const b = b64d(v.data[0]);
  if (b.length !== 608) throw new Error("offer size " + b.length);
  const u64 = o => { let x = 0n; for (let i = 7; i >= 0; i--) x = (x << 8n) | BigInt(b[o + i]); return x; };
  const now = BigInt(Math.floor(Date.now() / 1000));
  let best = null;
  for (let i = 0; i < CONFIG.onreMaxVectors; i++) {
    const o = CONFIG.onreVectorsOff + i * CONFIG.onreVectorSize;
    const st = u64(o);
    if (st !== 0n && st <= now && (best === null || st > best.st))
      best = {st, baseTime: u64(o + 8), basePrice: u64(o + 16), apr: u64(o + 24), pfd: u64(o + 32)};
  }
  if (!best) throw new Error("无激活定价向量");
  if (best.pfd === 0n) throw new Error("pfd=0");
  const stepEnd = ((now - best.baseTime) / best.pfd + 1n) * best.pfd;   // 阶梯价:本区间末
  const den = BigInt(CONFIG.onreAprScale) * BigInt(CONFIG.onreSecondsInYear);
  const nav = Number(best.basePrice * (den + best.apr * stepEnd) / den) / 1e9;
  if (nav < CONFIG.onycNavMin || nav > CONFIG.onycNavMax) throw new Error("NAV 越界 " + nav);
  const apy = Number(best.apr) / CONFIG.onreAprScale;   // NAV 年化增速 = ONyc 收益率
  if (apy < 0 || apy > 0.5) throw new Error("收益率越界 " + apy);
  return {nav, apy};
}

// RAY 质押:本金 depositBalance(ledger off 72)+ 待领取奖励
// (deposit×rewardPerShareNet/1e9 − rewardDebt;池 rewardPerShareNet 在 off 168,u128,精度 1e9)
async function rayStaked() {
  const [lr, pr] = await Promise.all([
    rpcCall("getAccountInfo", [CONFIG.rayLedger, {encoding: "base64"}]),
    rpcCall("getAccountInfo", [CONFIG.rayStakePool, {encoding: "base64"}]),
  ]);
  if (!lr.value) return {staked: 0, pending: 0, total: 0};
  const L = b64d(lr.value.data[0]);
  const uN = (b, o, n) => { let x = 0n; for (let i = n - 1; i >= 0; i--) x = (x << 8n) | BigInt(b[o + i]); return x; };
  const deposit = uN(L, 72, 8), rewardDebt = uN(L, 80, 8);
  let pending = 0n;
  if (pr.value) {
    const rps = uN(b64d(pr.value.data[0]), 168, 16);  // rewardPerShareNet, u128
    pending = deposit * rps / 1000000000n - rewardDebt;
    if (pending < 0n) pending = 0n;
  }
  const staked = Number(deposit) / 1e6, pend = Number(pending) / 1e6;
  return {staked, pending: pend, total: staked + pend};
}

// 迷你 Markdown 渲染:标题/列表(含任务勾选)/表格/引用/分隔线/粗体/行内代码
function mdRender(md) {
  const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = t => esc(t)
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
  const lines = md.split("\n");
  const out = [], liStack = [];
  const closeLists = n => { while (liStack.length > n) { out.push("</ul>"); liStack.pop(); } };
  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i];
    const m = ln.match(/^(\s*)(?:-|\d+\.) (.*)$/);
    if (m) {
      const depth = Math.floor(m[1].length / 2) + 1;
      while (liStack.length < depth) { out.push("<ul>"); liStack.push(1); }
      closeLists(depth);
      let item = m[2];
      const task = item.match(/^\[( |x)\] (.*)$/);
      item = task
        ? `<input type="checkbox" disabled${task[1] === "x" ? " checked" : ""}> ` + inline(task[2])
        : inline(item);
      out.push("<li>" + item + "</li>");
      continue;
    }
    closeLists(0);
    if (ln.startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].startsWith("|")) rows.push(lines[i++]);
      i--;
      const cells = r => r.split("|").slice(1, -1).map(c => inline(c.trim()));
      let t = "<table><tr>" + cells(rows[0]).map(c => `<th>${c}</th>`).join("") + "</tr>";
      for (const r of rows.slice(2)) t += "<tr>" + cells(r).map(c => `<td>${c}</td>`).join("") + "</tr>";
      out.push(t + "</table>");
      continue;
    }
    if (/^### /.test(ln)) { out.push("<h3>" + inline(ln.slice(4)) + "</h3>"); continue; }
    if (/^## /.test(ln)) { out.push("<h2>" + inline(ln.slice(3)) + "</h2>"); continue; }
    if (/^# /.test(ln)) { out.push("<h1>" + inline(ln.slice(2)) + "</h1>"); continue; }
    if (/^---+\s*$/.test(ln)) { out.push("<hr>"); continue; }
    if (ln.startsWith("> ")) { out.push("<blockquote>" + inline(ln.slice(2)) + "</blockquote>"); continue; }
    if (ln.trim() === "") continue;
    out.push("<p>" + inline(ln) + "</p>");
  }
  closeLists(0);
  return out.join("\n");
}

function derive(s) {
  const px = s.prices, oc = CONFIG.offchain;
  const govU = s.ena * px.ENA + s.ray * px.RAY + oc.asterAmt * px.ASTER;
  const solTotal = s.mndeSol + s.wSol;   // 原生质押(双钱包)+ 钱包零头;stkeSOL 仓位 2026-09-02 已清零
  const solU = solTotal * px.SOL;
  const pendingBtc = oc.pendingBtcAmt || 0;   // 币安已买、待转冷钱包的 BTC(转入后此值清零)
  const btcTotalAmt = s.btcAmt + pendingBtc;
  const btcU = btcTotalAmt * px.BTC;
  const wStableU = s.wUsdc + (s.wUsdt || 0);   // 钱包稳定币 = USDC + USDT,都按 $1 计
  // 钱包稳定币里有一份是金库(清单 §1「2 个月 Trust Wallet」):算总资产、算金库,但不算干火药。
  // 上限取 Trust Wallet 自己的余额,不取两钱包合计 —— 否则 Trust 里的零头缺口会被从币安钱包的干火药里扣走
  const wTreasuryU = Math.min(oc.treasuryWalletU || 0, s.wTrustStable ?? wStableU);
  // 币安钱包里的 USDC 是 Marinade Recipes 按 epoch 发来的质押收益(待收割归生活费):算总资产、算稳定类,
  // 但不算干火药、不进稳定币成本基准 —— 否则每月收割那天干火药会"凭空少一截"、看着像动了干火药
  const usdcRewardsU = Math.max(0, Math.min(s.wRewardsUsdc || 0, wStableU - wTreasuryU));
  const wDeployableU = wStableU - wTreasuryU - usdcRewardsU;
  const treasuryTotalU = oc.treasuryU + wTreasuryU;
  const stablesU = s.usdcLendU + s.kvaultUsdgU + wStableU + oc.treasuryU + oc.dryPowderU + oc.otherStablesU;
  const total = solU + btcU + s.onycU + govU + stablesU;
  // 实时净 APY:ONYC 毛收益按链上 apr,债务成本按实时借贷利率
  const a = s.apys || CONFIG.apyFallback;
  const onycE = s.onycDep - s.onycBor;
  const onycY = s.onycYield ?? CONFIG.onycYield;   // 实时 ONyc 收益率(OnRe apr),失败退备援
  const onycNet = onycE > 0 ? (s.onycDep * onycY - s.onycBor * a.usdcBorrow) / onycE : 0;
  // 估算月收入(实时 APY × 各仓位现值,/12)
  const kvaultApy = (s.kvaultUsdgApy ?? CONFIG.kvaultSteakhouseUsdgApyFallback)
                   + (s.kvaultUsdgFarmApy ?? CONFIG.kvaultSteakhouseUsdgFarmApyFallback);  // 基础 + farm 奖励
  const inc = {
    nat: s.mndeSol * px.SOL * (s.natApy ?? 0) / 12,
    // 原生质押分两份:Trust(Marinade Native,复利进 stake 账户)/ 币安钱包(Marinade Recipes,按 epoch 以 USDC 发到钱包)
    natTrust: (s.liveNativeTrust ?? 0) * px.SOL * (s.natApy ?? 0) / 12,
    natBinance: (s.liveNativeBinance ?? 0) * px.SOL * (s.natApy ?? 0) / 12,
    onyc: s.onycU * onycNet / 12,
    ray: s.ray * px.RAY * a.rayApr / 12,
    usdc: s.usdcLendU * (a.usdcLend || 0) / 12,
    kvaultUsdg: s.kvaultUsdgU * kvaultApy / 12,
  };
  inc.total = inc.nat + inc.onyc + inc.ray + inc.usdc + inc.kvaultUsdg;
  // 利润口径:实时原生质押 SOL − 成本基准 4150 SOL,按现价折 USD;
  // ONYC / 稳定类 / RAY 各按现值 − 各自 USD 成本基准。与组合占比口径独立。
  const cb = CONFIG.costBasis;
  const liveStakeSol = s.liveNativeSol || 0;
  const stablesOnchain = s.usdcLendU + s.kvaultUsdgU + wDeployableU;  // 链上稳定币(Kamino 存款 + 钱包可部署部分),不含金库 war-chest,也不含 USDC 质押收益(下面单列)
  const profit = {
    liveStakeSol,
    stakingSol: liveStakeSol - cb.stakingSol,
    stakingU: (liveStakeSol - cb.stakingSol) * px.SOL,
    onyc: s.onycU - cb.onycU,                          // ONYC 净值 USD − 成本基准
    rayCur: s.ray, rayU: s.ray * px.RAY,
    ray: (s.ray - cb.rayTokens) * px.RAY,              // RAY 币本位:(现 RAY − 本金 RAY) × 价
    stablesBase: stablesOnchain,
    stables: stablesOnchain - cb.stablesU,             // 链上稳定币 USD − 成本基准
    usdcRewards: usdcRewardsU,                         // 币安钱包 USDC = Marinade Recipes 质押收益(成本基准 0,全是收益)
    src: s.liveStakeSrc || "fallback",
  };
  profit.total = profit.stakingU + profit.onyc + profit.stables + profit.ray + profit.usdcRewards;
  return {govU, solTotal, solU, btcU, btcTotalAmt, pendingBtc, stablesU, total,
          share: total ? solU / total : 0, wStableU, wTreasuryU, wDeployableU, treasuryTotalU,
          dryU: wDeployableU + oc.dryPowderU, usdcRewardsU,
          onycNet, apys: a, inc, profit};
}

const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u8 => btoa(String.fromCharCode(...u8));

async function deriveKey(password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password),
    "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits(
    {name: "PBKDF2", salt: b64d(ENC.salt), iterations: ENC.iter, hash: "SHA-256"}, base, 512));
}
// 前 32 字节 AES-256-CBC 密钥,后 32 字节 HMAC-SHA256 密钥;MAC 校验通过才解密
async function tryKey(dk) {
  const iv = b64d(ENC.iv), ct = b64d(ENC.ct);
  const macKey = await crypto.subtle.importKey("raw", dk.slice(32),
    {name: "HMAC", hash: "SHA-256"}, false, ["verify"]);
  const data = new Uint8Array(iv.length + ct.length);
  data.set(iv); data.set(ct, iv.length);
  if (!await crypto.subtle.verify("HMAC", macKey, b64d(ENC.mac), data)) return null;
  const aesKey = await crypto.subtle.importKey("raw", dk.slice(0, 32), "AES-CBC", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name: "AES-CBC", iv}, aesKey, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

// 触屏没有 hover:点击带 title 的 APY 弹出说明框,点其他处关闭
document.addEventListener("click", e => {
  const old = document.getElementById("tipbox");
  if (old) old.remove();
  const t = e.target.closest(".apy[title], .donut[title]");
  if (!t) return;
  const box = document.createElement("div");
  box.id = "tipbox";
  box.textContent = t.getAttribute("title");
  document.body.appendChild(box);
  const r = t.getBoundingClientRect();
  box.style.top = Math.min(window.innerHeight - box.offsetHeight - 8, r.bottom + 8) + "px";
  box.style.left = Math.max(8, Math.min(window.innerWidth - box.offsetWidth - 8,
    r.left + r.width / 2 - box.offsetWidth / 2)) + "px";
});

async function fetchAll() {
  if (!booted || busy) return;
  busy = true;
  setStatus("refreshing on-chain data…");
  const warnings = [];
  const [prices, onre, kvault, wallet, ena, ray, btc, apys, liveStake] = await Promise.allSettled([
    getPrices(),
    kaminoOnre(),
    kaminoVaultUsdg(),
    Promise.all([walletStables(CONFIG.walletKamino), walletStables(CONFIG.walletMarinade),
                 walletSol(CONFIG.walletKamino), walletSol(CONFIG.walletMarinade)])
      .then(([t1, t2, s1, s2]) => ({usdc: t1.usdc + t2.usdc, usdt: t1.usdt + t2.usdt,
                                    trust: t2.usdc + t2.usdt,   // 金库 earmark 只认 Trust 这份
                                    // 币安钱包的 USDC = Marinade Recipes 按 epoch 发来的质押收益(待收割),不是干火药
                                    rewardsUsdc: ({kamino: t1, marinade: t2}[CONFIG.usdcRewardsWallet] || {usdc: 0}).usdc,
                                    sol: s1 + s2})),
    enaStaked(),
    rayStaked(),
    btcCold(),
    liveApys(),
    liveStakingSol(),
  ]);
  const pick = (r, label, fb) => {
    if (r.status === "fulfilled") return r.value;
    console.warn(label, r.reason);
    warnings.push(label + " query failed — showing last known value");
    return fb;
  };
  const now = new Date().toISOString();
  const p = pick(prices, "prices", state.prices);
  const onr = pick(onre, "Kamino OnRe", {onycU: state.onycU, usdcLendU: state.usdcLendU,
                                         onycDep: state.onycDep, onycBor: state.onycBor,
                                         onycNav: state.onycNav, onycYield: state.onycYield,
                                         onycNavSrc: state.onycNavSrc});
  let kvaultV;
  if (kvault.status === "fulfilled")
    kvaultV = {u: kvault.value.u, apy: kvault.value.apy, farmApy: kvault.value.farmApy, src: "on-chain"};
  else { console.warn("Kamino Steakhouse USDG vault", kvault.reason);
         warnings.push("Kamino Steakhouse USDG vault query failed — showing last known value");
         kvaultV = {u: state.kvaultUsdgU, apy: state.kvaultUsdgApy, farmApy: state.kvaultUsdgFarmApy, src: "fallback"}; }
  const apyV = apys.status === "fulfilled" ? {v: apys.value, src: "on-chain"}
    : (console.warn("APYs", apys.reason),
       warnings.push("APY query failed — using fallback rates"),
       {v: state.apys || CONFIG.apyFallback, src: "fallback"});
  const w = pick(wallet, "wallet balances", {usdc: state.wUsdc, usdt: state.wUsdt,
                                            trust: state.wTrustStable, rewardsUsdc: state.wRewardsUsdc,
                                            sol: state.wSol});
  let enaV, rayV;
  if (ena.status === "fulfilled") enaV = {amt: ena.value, src: "on-chain"};
  else { console.warn("ENA", ena.reason);
         warnings.push("ENA stake query failed — using fallback value");
         enaV = {amt: CONFIG.offchain.govFallback.ENA, src: "fallback"}; }
  if (ray.status === "fulfilled") rayV = {...ray.value, src: "on-chain"};
  else { console.warn("RAY", ray.reason);
         warnings.push("RAY stake query failed — using fallback value");
         rayV = {staked: CONFIG.offchain.govFallback.RAY, pending: 0,
                 total: CONFIG.offchain.govFallback.RAY, src: "fallback"}; }
  let btcV;
  if (btc.status === "fulfilled") btcV = {amt: btc.value, src: "on-chain"};
  else { console.warn("BTC", btc.reason);
         warnings.push("BTC cold wallet query failed — using fallback value");
         btcV = {amt: CONFIG.offchain.btcCold, src: "fallback"}; }
  // 实时原生质押 SOL(Trust via Marinade TVL API + 币安钱包快照);失败退上次值
  let lsV;
  if (liveStake.status === "fulfilled") lsV = {...liveStake.value, src: "on-chain"};
  else { console.warn("live staking SOL", liveStake.reason);
         warnings.push("live staking SOL query failed — showing last known value");
         lsV = {nativeSol: state.liveNativeSol, nativeTrust: state.liveNativeTrust,
                nativeBinance: state.liveNativeBinance, src: "fallback"}; }
  // 原生质押金额用实时数(组合口径与利润口径一致);APY 取 Marinade API(浏览器实时)
  state = {prices: p, mndeSol: lsV.nativeSol,
           liveNativeSol: lsV.nativeSol,
           liveNativeTrust: lsV.nativeTrust ?? state.liveNativeTrust ?? 0,
           liveNativeBinance: lsV.nativeBinance ?? state.liveNativeBinance ?? 0,
           liveStakeSrc: lsV.src,
           natApy: apyV.v.natApy ?? state.natApy,
           natSrc: apyV.v.natApy != null ? "live" : state.natSrc,
           natDetail: state.natDetail,
           onycU: onr.onycU, usdcLendU: onr.usdcLendU,
           kvaultUsdgU: kvaultV.u, kvaultUsdgApy: kvaultV.apy,
           kvaultUsdgFarmApy: kvaultV.farmApy, kvaultUsdgSrc: kvaultV.src,
           onycDep: onr.onycDep, onycBor: onr.onycBor,
           onycNav: onr.onycNav, onycYield: onr.onycYield, onycNavSrc: onr.onycNavSrc,
           apys: apyV.v, apySrc: apyV.src,
           wUsdc: w.usdc, wUsdt: w.usdt, wTrustStable: w.trust, wRewardsUsdc: w.rewardsUsdc ?? 0,
           wSol: w.sol, ena: enaV.amt, enaSrc: enaV.src,
           ray: rayV.total, rayStaked: rayV.staked, rayPending: rayV.pending, raySrc: rayV.src,
           btcAmt: btcV.amt, btcSrc: btcV.src,
           onchainAt: now, pricesAt: now, warnings};
  busy = false;
  render();
}

async function refreshPrices() {
  if (!booted || busy) return;
  try {
    const fresh = await getPrices();
    state.prices = fresh;
    state.pricesAt = new Date().toISOString();
    priceError = false;
    render();
  } catch (e) { console.warn("price refresh failed", e); priceError = true; setStatus(); }
}

function boot(payload) {
  CONFIG = payload.config;
  state = payload.initial;
  CHECKLIST = payload.checklist || "";
  booted = true;
  $("gate").style.display = "none";
  setInterval(refreshPrices, 60000);     // 价格每 60s
  setInterval(fetchAll, 600000);         // 链上仓位每 10min
  setInterval(() => { if (!busy) setStatus(); }, 1000);  // 状态栏每秒走表
  render();
  fetchAll();
}

async function submitPw() {
  const v = $("pw").value;
  if (!v) return;
  $("gate-err").textContent = "";
  $("unlock").disabled = true;
  $("unlock").textContent = "deriving key…";
  try {
    const dk = await deriveKey(v);
    const payload = await tryKey(dk);
    if (!payload) {
      $("gate-err").textContent = "Wrong password";
    } else {
      if ($("remember").checked) localStorage.setItem("cycleops_k", b64e(dk));
      boot(payload);
    }
  } catch (e) {
    $("gate-err").textContent = "Unlock failed: " + e.message;
  }
  $("unlock").disabled = false;
  $("unlock").textContent = "Unlock";
}

$("unlock").addEventListener("click", submitPw);
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") submitPw(); });
function lockNow() { localStorage.removeItem("cycleops_k"); location.reload(); }
document.addEventListener("visibilitychange", () => {
  if (booted && !document.hidden
      && Date.now() - new Date(state.pricesAt).getTime() > 60000) refreshPrices();
});

// 下拉手势(移动端):顶部下拉整页随手指下移。越过 REFRESH 阈值松手 → fetchAll;
// 继续用力下拉越过 LOCK 阈值松手 → 锁定(忘记本机密钥)。取代原 Refresh / Lock 按钮。
(function () {
  const ptr = $("ptr"), icon = $("ptr-icon"), text = $("ptr-text"), sc = $("scroll");
  const REFRESH = 60, LOCK = 175, MAX = 230;
  let startY = 0, dist = 0, pulling = false, H = 64;
  sc.addEventListener("touchstart", e => {
    if (!booted || busy || e.touches.length !== 1 || sc.scrollTop > 0) { pulling = false; return; }
    startY = e.touches[0].clientY; dist = 0; pulling = true; H = ptr.offsetHeight || 64;
    sc.classList.add("dragging");
  }, { passive: true });
  sc.addEventListener("touchmove", e => {
    if (!pulling) return;
    dist = e.touches[0].clientY - startY;
    if (dist <= 0 || sc.scrollTop > 0) { pulling = false; sc.classList.remove("dragging"); sc.style.transform = ""; return; }
    const pull = Math.min(dist * 0.5, MAX);            // 阻尼:整页下移 pull 像素
    sc.style.transform = "translateY(" + pull + "px)";
    if (pull >= LOCK) {                                // 深拉:锁定区(红色)
      icon.textContent = "🔒"; icon.style.transform = ""; text.textContent = "Release to lock";
      ptr.style.color = "var(--red)";
    } else {
      icon.textContent = "↓"; ptr.style.color = "";
      icon.style.transform = "rotate(" + (pull >= REFRESH ? 180 : 0) + "deg)";
      text.textContent = pull >= REFRESH ? "Release to refresh" : "Pull to refresh";
    }
    if (dist > 6) e.preventDefault();                  // 抑制原生滚动
  }, { passive: false });
  sc.addEventListener("touchend", () => {
    if (!pulling) return;
    pulling = false;
    const pull = Math.min(dist * 0.5, MAX);
    sc.classList.remove("dragging");                   // 恢复过渡,松手回弹有动画
    if (pull >= LOCK) {                                // 深拉松手 → 锁定
      text.textContent = "Locking…"; lockNow(); return;
    }
    if (pull < REFRESH || busy) { sc.style.transform = ""; ptr.style.color = ""; return; }
    sc.style.transform = "translateY(" + H + "px)";    // 保持下移,露出转圈
    ptr.classList.add("spin"); icon.textContent = "↻"; icon.style.transform = "";
    text.textContent = "Refreshing…";
    Promise.resolve(fetchAll()).catch(() => {}).finally(() => {
      ptr.classList.remove("spin"); icon.textContent = "↓"; text.textContent = "Pull to refresh";
      sc.style.transform = ""; ptr.style.color = "";   // 回弹到顶
    });
  }, { passive: true });
})();

(async () => {
  const cached = localStorage.getItem("cycleops_k");  // 记住的是派生密钥,不是密码本身
  if (cached) {
    try {
      const payload = await tryKey(b64d(cached));
      if (payload) return boot(payload);
    } catch (e) { console.warn("cached key invalid", e); }
    localStorage.removeItem("cycleops_k");
  }
  $("gate").style.display = "flex";
  $("pw").focus();
})();
</script>
